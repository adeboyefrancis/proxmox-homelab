---
- name: Configure HashiCorp Vault
  hosts: hcp-vault
  become: true

  tasks:

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - gpg
          - ca-certificates
          - lsb-release
        state: present
        update_cache: true

    - name: Download HashiCorp GPG key
      ansible.builtin.get_url:
        url: https://apt.releases.hashicorp.com/gpg
        dest: /usr/share/keyrings/hashicorp-archive-keyring.asc
        mode: "0644"

    - name: Add HashiCorp repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.asc]
          https://apt.releases.hashicorp.com
          {{ ansible_distribution_release }}
          main
        filename: hashicorp
        state: present

    - name: Install Vault
      ansible.builtin.apt:
        name: vault
        state: present
        update_cache: true

    - name: Create Vault data directory
      ansible.builtin.file:
        path: /opt/vault/data
        state: directory
        owner: vault
        group: vault
        mode: "0750"

    - name: Configure Vault
      ansible.builtin.copy:
        dest: /etc/vault.d/vault.hcl
        owner: vault
        group: vault
        mode: "0640"
        content: |
          ui = true

          storage "raft" {
            path    = "/opt/vault/data"
            node_id = "vault-01"
          }

          listener "tcp" {
            address     = "0.0.0.0:8200"
            tls_disable = true
          }

          api_addr = "http://{{ ansible_host }}:8200"

          disable_mlock = true

    - name: Enable and start Vault
      ansible.builtin.systemd:
        name: vault
        enabled: true
        state: started

    - name: Check Vault service
      ansible.builtin.systemd:
        name: vault
      register: vault_status

    - name: Display Vault status
      ansible.builtin.debug:
        msg: "Vault is {{ vault_status.status.ActiveState }}"
