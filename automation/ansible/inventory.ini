#------Nodes------#
[lxcs]
# Technitium Internal DNS server
technitium-dns ansible_host=10.10.0.20
# Hashicorp Vault
hcp-vault ansible_host=10.10.0.30
# Github CI/CD Runner
github-ci-runner ansible_host=10.10.0.40

[vms]
# Portainer VM
portainer-vm ansible_host=10.20.0.10
# K3s Cluster Nodes
k3s-control-node ansible_host=10.20.0.20
k3s-worker-node ansible_host=10.20.0.21


#------Configs-----#
[lxcs:vars]
# SSH Keys for All Nodes 
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/ansible

[vms:vars]
# SSH Keys for VMs
ansible_user=admin
ansible_ssh_private_key_file=~/.ssh/ansible
# SSH Keys for K3s Nodes
ansible_user=platform
ansible_ssh_private_key_file=~/.ssh/ansible

ansible_user=worker
ansible_ssh_private_key_file=~/.ssh/ansible
