---
- name: Install and configure HashiCorp Vault
  hosts: hcp-vault
  become: true

  vars:
    vault_version_codename: "{{ ansible_distribution_release }}"

  tasks:
    - name: Install prerequisites
      apt:
        name:
          - gnupg
          - software-properties-common
          - curl
        state: present
        update_cache: true

    - name: Add HashiCorp GPG key
      get_url:
        url: https://apt.releases.hashicorp.com/gpg
        dest: /usr/share/keyrings/hashicorp-archive-keyring.asc
        mode: "0644"

    - name: Add HashiCorp apt repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.asc] https://apt.releases.hashicorp.com {{ vault_version_codename }} main"
        state: present
        filename: hashicorp

    - name: Install Vault
      apt:
        name: vault
        state: present
        update_cache: true

    - name: Ensure Vault data directory exists
      file:
        path: /opt/vault/data
        state: directory
        owner: vault
        group: vault
        mode: "0750"

    - name: Write Vault config (file storage backend, single-node homelab)
      copy:
        dest: /etc/vault.d/vault.hcl
        owner: vault
        group: vault
        mode: "0640"
        content: |
          disable_mlock = true

          storage "file" {
            path = "/opt/vault/data"
          }

          listener "tcp" {
            address     = "0.0.0.0:8200"
            tls_disable = 1  # internal lab only, behind NAT -- revisit TLS before exposing externally
          }

          api_addr     = "http://10.10.0.30:8200"
          ui           = true
      notify: Restart vault

    - name: Enable and start Vault
      systemd:
        name: vault
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart vault
      systemd:
        name: vault
        state: restarted
